<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klein Weather</title>
    <link rel="shortcut icon" href="weather.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="medias.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <h1 class="temperature"></h1>
        <p class="cityName"></p>
        <p class="country"></p>
        <i id="iconWeather" class="weatherIcon"></i>
        <p class="weatherText"></p>
        <div class="search">
            <input type="text" name="city" id="city" placeholder="Search for a city">
            <button onclick="searchWeather()">Search</button>
        </div>
        <div class="loading" style="display: none;">
            <p><i class="fa-solid fa-spinner fa-spin"></i></p> 
            <p>Loading Weather...</p>
        </div>
    </header>
    <main>
        <section class="hourly">
        </section>
        <section class="daily">
        </section>
    </main>
    <footer>
        <p>Website developed by Tainá Klein <i class="fa-regular fa-copyright"></i> 2026</p>
    </footer>

    <script src="interaction.js"></script>
</body>
</html>
